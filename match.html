<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE ECHO - Voice Lab</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --fire: #ff4757;
      --sweat: #70a1ff;
      --shock: #ffa502;
      --bot: #2ed573;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 2px;
      color: #94a3b8;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* 同期ガイド注意書き */
    .sync-guide {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid #fbbf24;
      color: #fbbf24;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    /* タイマー＆コントロール */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 400px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:active { transform: scale(0.96); }

    .btn-start { background: #3b82f6; color: white; }
    .btn-start.listening { background: #ef4444; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* 叫んだ瞬間の全画面フィードバック (0.6秒フラッシュ) */
    .flash-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    .flash-overlay.active {
      opacity: 1;
    }
    .flash-emoji { font-size: 6rem; }
    .flash-text { font-size: 2rem; font-weight: bold; margin-top: 10px; color: #fff; text-align: center; padding: 0 16px; }

    /* 認識ログエリア */
    .log-container {
      width: 100%;
      max-width: 400px;
      flex: 1;
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      max-height: 45vh;
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .log-time { font-size: 0.8rem; color: #64748b; font-family: monospace; }
    .log-emoji { font-size: 1.5rem; }
    .log-text { font-size: 1rem; font-weight: 600; flex: 1; }
    .log-tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.1); }

    .interim-box {
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #38bdf8;
      height: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>PULSE ECHO VOICE-FIRST</h1>
  <div class="title">🎙️ 音声感情検知テスト</div>

  <!-- 修正②: テレビ再生位置との同期ガイド -->
  <div class="sync-guide">
    ⏱️ テレビのYouTube動画再生と【同時】にボタンを押してね！
  </div>

  <div class="controls">
    <button id="micBtn" class="btn-start">🎙️ 動画再生と同時にスタート</button>
  </div>

  <div id="interimText" class="interim-box">ボタンを押してテレビに向かって叫んでね！</div>

  <div class="log-container" id="logContainer">
    <div style="text-align:center; color:#64748b; font-size:0.85rem; padding-top:20px;">
      「なんでやねん！」「よっしゃー！」「神パス！」など<br>叫んだ言葉が自動でタイムスタンプ付き保存されます！
    </div>
  </div>

  <!-- 発言時の瞬間フラッシュ画面 -->
  <div class="flash-overlay" id="flashOverlay">
    <div class="flash-emoji" id="flashEmoji">🔥</div>
    <div class="flash-text" id="flashText">ナイスー！</div>
  </div>

  <script>
    // 辞書設定
    const DICTIONARY = [
      {
        emoji: "🔥",
        bg: "#ff4757",
        keywords: ["よっしゃ", "よし", "神", "ナイス", "ナイスー", "いけ", "すごい", "ゴール", "入った", "うま", "完璧", "きた"],
        defaultTag: "#神プレー"
      },
      {
        emoji: "😅",
        bg: "#70a1ff",
        // 修正①: 「ドマイ」→「どんまい」に修正！
        keywords: ["なんでやねん", "なんで", "あちゃ", "やってもた", "あかん", "おしい", "惜しい", "ミス", "うそやん", "まじか", "どんまい"],
        defaultTag: "#なんでやねん"
      },
      {
        emoji: "😳",
        bg: "#ffa502",
        keywords: ["マジ", "まじ", "えぐ", "エグい", "やば", "ヤバい", "うそろ", "嘘だろ", "は？"],
        defaultTag: "#マジか"
      },
      {
        emoji: "🤖",
        bg: "#2ed573",
        keywords: ["シュート", "パス", "キーパー", "カット", "コーナー", "ファール", "カウンター"],
        defaultTag: "#事実タグ"
      }
    ];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("お使いのブラウザは音声認識機能に対応していません。ChromeまたはSafariでお試しください！");
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      let isListening = false;
      let startTime = null;

      const micBtn = document.getElementById('micBtn');
      const interimText = document.getElementById('interimText');
      const logContainer = document.getElementById('logContainer');
      const flashOverlay = document.getElementById('flashOverlay');
      const flashEmoji = document.getElementById('flashEmoji');
      const flashText = document.getElementById('flashText');

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
          startTime = new Date();
          isListening = true;
          micBtn.textContent = "🛑 測定中（テレビに向かって叫んで！）";
          micBtn.classList.add('listening');
        } else {
          recognition.stop();
          isListening = false;
          micBtn.textContent = "🎙️ 動画再生と同時にスタート";
          micBtn.classList.remove('listening');
        }
      });

      recognition.onend = () => {
        if (isListening) recognition.start();
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const finalSpeech = event.results[i][0].transcript.trim();
            if (finalSpeech.length > 0) {
              processSpeech(finalSpeech);
            }
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        interimText.textContent = interim ? `🎤 聞き取り中: ${interim}` : '🎤 テレビに向かって叫んで！';
      };

      function processSpeech(text) {
        let matchedEmotion = null;

        for (const item of DICTIONARY) {
          for (const kw of item.keywords) {
            if (text.includes(kw)) {
              matchedEmotion = {
                emoji: item.emoji,
                bg: item.bg,
                tag: `#${kw}`,
                text: text
              };
              break;
            }
          }
          if (matchedEmotion) break;
        }

        if (!matchedEmotion) {
          matchedEmotion = {
            emoji: "🤖",
            bg: "#2ed573",
            tag: "#ボイス",
            text: text
          };
        }

        triggerFlash(matchedEmotion);
        addLog(matchedEmotion);
      }

      function triggerFlash(data) {
        flashEmoji.textContent = data.emoji;
        flashText.textContent = data.text;
        flashOverlay.style.background = data.bg + "ee";
        flashOverlay.classList.add('active');

        setTimeout(() => {
          flashOverlay.classList.remove('active');
        }, 600);
      }

      function addLog(data) {
        const now = new Date();
        const diffSec = Math.floor((now - startTime) / 1000);
        const min = String(Math.floor(diffSec / 60)).padStart(2, '0');
        const sec = String(diffSec % 60).padStart(2, '0');
        const timeStr = `${min}:${sec}`;

        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <div class="log-time">${timeStr}</div>
          <div class="log-emoji">${data.emoji}</div>
          <div class="log-text">${data.text}</div>
          <div class="log-tag">${data.tag}</div>
        `;

        if (logContainer.children.length === 1 && logContainer.children[0].tagName === 'DIV' && logContainer.children[0].style.textAlign === 'center') {
          logContainer.innerHTML = '';
        }

        logContainer.insertBefore(item, logContainer.firstChild);

        // 修正③: 今後のSupabase保存用のTODO領域
        /* TODO: Supabase保存処理
        const { error } = await supabase
          .from('futsal_goods')
          .insert({
            video_id: videoId,         // 試合のYouTube ID
            good_time: diffSec,        // 動画の経過秒数
            description: data.emoji,   // 感情スタンプ (🔥 😅 😳 🤖)
            user_name: userName,       // 発言者名（「俺やで」で設定した名前）
            comment: data.text         // 拾った音声テキスト
          });
        */
      }
    }
  </script>
</body>
</html>
