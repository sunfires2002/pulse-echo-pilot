<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE ECHO - Match View</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pulse-app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      max-width: 1400px;
      margin: 0 auto;
      color: #fff;
      background-color: #0f172a;
      min-height: 100vh;
    }

    .video-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 600px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-shell iframe {
      width: 100%;
      height: 100%;
    }

    .btn-primary-voice {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      cursor: pointer;
    }

    .emotion-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .btn-emotion {
      padding: 12px 8px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
    }

    .sub-actions {
      display: flex;
      gap: 8px;
    }

    .btn-tertiary {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      cursor: pointer;
    }

    .timeline-panel {
      display: none;
    }

    .timeline-panel.active {
      display: block;
    }

    .compact-tab-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    @media (min-width: 900px) and (orientation: landscape) {
      .pulse-app {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        height: 100dvh;
      }

      .left-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }

      .timeline-panel {
        display: block !important;
        background: #1e293b;
        border-radius: 16px;
        padding: 16px;
        overflow-y: auto;
      }

      .compact-tab-bar {
        display: none;
      }
    }
  </style>  
</head>
<body>

  <div class="pulse-app">
    <!-- 左カラム（コンパクト時は全体 / スプリット時は左側） -->
    <div class="left-column">
      <div class="video-shell">
        <!-- 16:9 保持のYouTube Player -->
        <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
      </div>

      <div class="controls-container">
        <!-- Primary: 音声入力 -->
        <button class="btn-primary-voice">🎙️ 音声入力をスタート</button>

        <!-- Secondary: 感情ボタン -->
        <div class="emotion-group">
          <button class="btn-emotion">🔥 ナイス</button>
          <button class="btn-emotion">😢 惜しい</button>
          <button class="btn-emotion">😅 あちゃー</button>
          <button class="btn-emotion">😳 マジで</button>
        </div>

        <!-- Tertiary: サブ機能 -->
        <div class="sub-actions">
          <button class="btn-tertiary">🤖 AIにお任せ</button>
          <button class="btn-tertiary">🎯 ここな！</button>
        </div>
      </div>

      <!-- Compact UI用 タブ切り替えボタン（スマホ時のみ表示） -->
      <div class="compact-tab-bar">
        <button class="tab-btn active" onclick="toggleTimeline(false)">操作パネル</button>
        <button class="tab-btn" onclick="toggleTimeline(true)">📊 タイムライン</button>
      </div>
    </div>

    <!-- 右カラム（コンパクト時はタブ切替 / スプリット時は常時右側表示） -->
    <div class="right-column timeline-panel" id="timelinePanel">
      <div class="reaction-map">/* 反応マップ */</div>
      <div class="echo-timeline">/* ECHO TIMELINE */</div>
    </div>
  </div>

  <!-- スマホ用 タブ切り替え制御スクリプト -->
  <script>
    function toggleTimeline(showTimeline) {
      const panel = document.getElementById('timelinePanel');
      const tabs = document.querySelectorAll('.tab-btn');
      const controls = document.querySelector('.controls-container');

      if (showTimeline) {
        panel.classList.add('active');
        controls.style.display = 'none'; // タイムライン表示時は操作パネルを非表示
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
      } else {
        panel.classList.remove('active');
        controls.style.display = 'block'; // 操作パネルを表示
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      }
    }
  </script>
</body>
</html>
