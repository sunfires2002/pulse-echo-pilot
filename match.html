<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE ECHO - Match View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b1329;
      color: #fff;
      font-family: sans-serif;
    }

    .pulse-app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .video-shell {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 600px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-shell iframe {
      width: 100%;
      height: 100%;
    }

    .btn-primary-voice {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .emotion-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 10px 0;
    }

    .btn-emotion {
      padding: 10px 4px;
      font-size: 0.8rem; /* 文字がはみ出ないよう調整 */
      white-space: nowrap; /* 改行を防止 */
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
    }

    .sub-actions {
      display: flex;
      gap: 8px;
    }

    .btn-tertiary {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
    }

    .timeline-panel {
      display: none;
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
    }

    .timeline-panel.active {
      display: block;
    }

    .compact-tab-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* 900px以上の横画面：スプリット表示 */
    @media (min-width: 900px) and (orientation: landscape) {
      .pulse-app {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 16px;
        height: 100vh;
      }

      .left-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }

      .timeline-panel {
        display: block !important;
        overflow-y: auto;
      }

      .compact-tab-bar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="pulse-app">
    <div class="left-column">
      <div class="video-shell">
        <iframe id="player" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
      </div>

      <div class="controls-container" id="controlsContainer">
        <button class="btn-primary-voice">🎙️ 音声入力をスタート</button>

        <div class="emotion-group">
          <button class="btn-emotion">🔥 ナイス</button>
          <button class="btn-emotion">😢 惜しい</button>
          <button class="btn-emotion">😅 あちゃー</button>
          <button class="btn-emotion">😳 マジで</button>
        </div>

        <div class="sub-actions">
          <button class="btn-tertiary">🤖 AIにお任せ</button>
          <button class="btn-tertiary">🎯 ここな！</button>
        </div>
      </div>

      <div class="compact-tab-bar">
        <button class="tab-btn active" onclick="toggleTimeline(false)">操作パネル</button>
        <button class="tab-btn" onclick="toggleTimeline(true)">📊 タイムライン</button>
      </div>
    </div>

    <!-- 実際のデータが入る右カラムエリア -->
    <div class="right-column timeline-panel" id="timelinePanel">
      <h3>ヒートマップ</h3>
      <div id="reactionMap"><!-- ここにSupabaseのヒートマップ描画処理が入る --></div>
      <h3 style="margin-top:16px;">タイムライン</h3>
      <div id="echoTimeline"><!-- ここにSupabaseのタイムラインリストが入る --></div>
    </div>
  </div>

  <script>
    function toggleTimeline(showTimeline) {
      const panel = document.getElementById('timelinePanel');
      const controls = document.getElementById('controlsContainer');
      const tabs = document.querySelectorAll('.tab-btn');

      if (showTimeline) {
        panel.classList.add('active');
        controls.style.display = 'none';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
      } else {
        panel.classList.remove('active');
        controls.style.display = 'block';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      }
    }
  </script>
</body>
</html>
