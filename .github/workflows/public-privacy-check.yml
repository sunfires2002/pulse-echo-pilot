name: Public privacy LAB boundary check (NO DEPLOY)
on:
  push:
    branches: [codex/public-information-protection-lab]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/public-read-contract.cjs
      - run: python3 tools/render_public_read_plan.py
      - run: python3 tools/public_privacy_files.py --build
      - run: python3 -m unittest discover -s tests -p 'public_privacy_*.py'
