<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>パスワード再設定｜検証用LAB</title>
<script>
// Remove credentials before loading any other resource. Never persist or log them.
window.PULSE_RECOVERY_INPUT = { hash: location.hash, search: location.search };
try { history.replaceState(null, '', location.pathname); } catch { window.PULSE_RECOVERY_INPUT = null; }
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#ecf3fc;font:16px/1.7 system-ui,sans-serif}main{max-width:620px;margin:40px auto;padding:24px}h1{font-size:25px;line-height:1.4}.badge{color:#8de4f3;font-weight:700}section{border:1px solid #354358;border-radius:12px;padding:20px;margin:20px 0;background:#142033}label{display:block;margin-top:12px}input,button{font:inherit;max-width:100%;border-radius:7px}input{width:100%;padding:10px;border:1px solid #8594a8;background:#fff;color:#152033}button{padding:10px 16px;margin-top:18px;background:#9be4f0;color:#10202a;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#9be4f0}:focus-visible{outline:3px solid #ffd46b;outline-offset:3px}[hidden]{display:none!important}#status{padding:14px;border-left:3px solid #9be4f0;overflow-wrap:anywhere}.note{font-size:14px;color:#c5d1e0}@media(max-width:480px){main{padding:16px;margin:12px auto}section{padding:16px}}
</style>
<script src="admin-lab-config.js" defer></script>
<script src="admin-password-reset.js" defer></script>
</head>
<body><main>
<p class="badge">検証用 Supabase 専用 LAB・8082</p>
<h1>パスワード再設定</h1>
<p>既存アカウントのパスワードだけを更新します。試合データにはアクセスしません。</p>
<p id="status" role="status" aria-live="polite">設定を確認しています。</p>
<section id="requestSection" hidden>
<h2>再設定メールを送る</h2>
<p class="note">管理者・非管理者を1人ずつ進めてください。新しいメールを、このMacで開きます。</p>
<form id="requestForm">
<label for="email">検証用アカウントのメールアドレス</label>
<input id="email" type="email" autocomplete="email" required maxlength="254">
<button id="send" type="submit">再設定メールを送信</button>
</form></section>
<section id="resetSection" hidden>
<h2>新しいパスワード</h2>
<p class="note">検証用プロジェクトで認証リンクを確認しました。既存のユーザーUUIDは変更しません。</p>
<form id="resetForm">
<label for="password">新しいパスワード（12文字以上）</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" required maxlength="256">
<label for="confirm">新しいパスワード（確認）</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="12" required maxlength="256">
<button id="save" type="submit" disabled>パスワードを保存</button>
</form></section>
<p class="note">この画面を再読み込みすると、再設定用の認証状態は失われます。リンク全文やパスワードを共有しないでください。</p>
<p><a href="admin.html">管理LABへ戻る</a></p>
</main></body></html>
